		<script>
		(function () {
			var loader = document.getElementById('fn-loader');
			var last = 0, smooth = 0;
			function tick(now) {
				if (!loader || loader.style.display === 'none') { return; }
				// (While the engine's own status screen is up, it's still downloading: count nothing.)
				if (document.getElementById('status') || !(last && now - last < 100)) { smooth = 0; } else { smooth++; }
				last = now;
				if (smooth >= 20) { loader.style.display = 'none'; return; }
				requestAnimationFrame(tick);
			}
			window.fnLoader = function (show) {
				if (!loader) { return; }
				loader.style.display = show ? 'flex' : 'none';
				smooth = 0;
				last = 0;
				if (show) { requestAnimationFrame(tick); }
			};
			requestAnimationFrame(tick);
		})();
		</script>

		<script>/* fn-handoff */
// A game framed by another site's page (itch) on Safari, or on any iPhone or iPad browser, gets
// storage that's kept in memory only: every save goes when the browser quits. As its own page the
// same address keeps them. So there: one PLAY button before anything is downloaded, and a tap
// opens this address as the whole page. (web_patch.py)
function fnHandoff(start) {
	var framed = false;
	try { framed = window.self !== window.top; } catch (e) { framed = true; }
	var own = false;
	if (framed) { try { own = !!window.top.location.host; } catch (e) { own = false; } }
	var shortLived = (navigator.vendor || '').indexOf('Apple') === 0 || /iPhone|iPad|iPod/.test(navigator.userAgent || '') || !!navigator.brave;
	var blocked = false;
	try { localStorage.setItem('fn_probe', '1'); localStorage.removeItem('fn_probe'); } catch (e) { blocked = true; }
	window.fnSavesAtRisk = false;
	if (!framed || own || !(shortLived || blocked)) { start(); return; }

	var box = document.createElement('div');
	box.id = 'fn-launch';
	box.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;'
		+ 'padding-bottom:9vh;background:linear-gradient(rgba(3,3,6,.25),rgba(3,3,6,.8)),url(index.png) center/contain no-repeat,#030306;'
		+ 'font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent';
	var button = document.createElement('button');
	button.type = 'button';
	button.textContent = 'PLAY';
	button.style.cssText = 'padding:10px 64px;background:#f0452f;color:#fff;font:inherit;font-weight:800;font-size:38px;letter-spacing:3px;'
		+ 'border:3px solid #fff;border-radius:0;transform:skewX(-8deg);box-shadow:0 5px 0 rgba(0,0,0,.6);cursor:pointer';
	var note = document.createElement('div');
	note.textContent = 'Opens full page. Keeps your save.';
	note.style.cssText = 'margin-top:14px;padding:0 16px;color:#e6e2ea;font-weight:600;font-size:17px;text-shadow:0 2px 0 #000';
	box.appendChild(button);
	box.appendChild(note);
	document.body.appendChild(box);
	console.log('fn-handoff: framed where saves would not last; waiting for a tap');

	// Where the game keeps its save: its fixed address when the build names one (web_patch.py --home:
	// the game's page for an iPhone or iPad, which says to add it to the Home Screen; the game itself
	// for anything else), else this same address as the whole page.
	var home = '';
	var apple = /iPhone|iPad|iPod/.test(navigator.userAgent || '') || (/Macintosh/.test(navigator.userAgent || '') && navigator.maxTouchPoints > 1);
	var where = home ? (apple ? home : home + 'play/') : location.href;
	// Each tap tries the next way: that address as the whole page, then a new tab, then here.
	var step = 'page';
	var busy = false;
	function stay() {
		// The game says on its title that this page won't keep the save (GameState.saves_at_risk).
		window.fnSavesAtRisk = true;
		if (box.parentNode) { box.parentNode.removeChild(box); }
		console.log('fn-handoff: playing in the frame');
		start();
	}
	function newTab() {
		var tab = null;
		try { tab = window.open(where, '_blank'); } catch (e) { tab = null; }
		if (!tab) { stay(); return; }
		step = 'here';
		button.textContent = 'PLAY HERE';
		note.textContent = "Opened in a new tab. This page won't keep your save.";
	}
	box.addEventListener('click', function (event) {
		event.preventDefault();
		if (busy) { return; }
		if (step === 'here') { stay(); return; }
		if (step === 'tab') { newTab(); return; }
		try {
			window.top.location.href = where;
		} catch (e) {
			// Not allowed to leave the frame: a new tab, inside this same tap.
			newTab();
			return;
		}
		busy = true;
		note.textContent = 'Opening...';
		// Still here in a moment: the browser kept the frame where it is, without saying so.
		setTimeout(function () {
			busy = false;
			step = 'tab';
			note.textContent = "Didn't open. Tap again for a new tab.";
		}, 4000);
	});
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":55140176,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

const fnStartEngine = (function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
});
fnHandoff(fnStartEngine);
